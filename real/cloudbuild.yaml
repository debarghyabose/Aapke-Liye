steps:
  # 1. Build the unified standalone image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/trusty-obelisk-515402-p3/aapke-liye/aapke-liye:latest'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/trusty-obelisk-515402-p3/aapke-liye/aapke-liye:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aapke-liye'
      - '--image'
      - 'us-central1-docker.pkg.dev/trusty-obelisk-515402-p3/aapke-liye/aapke-liye:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=trusty-obelisk-515402-p3,PROJECT_ID=trusty-obelisk-515402-p3,GEMINI_API_KEY=${_GEMINI_API_KEY},DASHBOARD_API_KEY=${_DASHBOARD_API_KEY}'
      - '--update-env-vars'
      - '^##^STAFF_API_KEYS=${_STAFF_API_KEYS}'

images:
  - 'us-central1-docker.pkg.dev/trusty-obelisk-515402-p3/aapke-liye/aapke-liye:latest'

substitutions:
  # Set real values in the Cloud Build trigger or via: gcloud builds submit --substitutions=_GEMINI_API_KEY=...,...
  _GEMINI_API_KEY: ''
  _DASHBOARD_API_KEY: ''
  _STAFF_API_KEYS: ''

options:
  logging: CLOUD_LOGGING_ONLY
