<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aapke Liye Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Devanagari&family=Noto+Sans+Bengali&family=Noto+Sans+Telugu&family=Noto+Sans+Tamil&display=swap">
<style>
:root {
  --bg: #f4f6f8; --surface: #fff; --ink: #172030; --muted: #5d6878; --line: #dde3ea;
  --accent: #1f5fbf; --accent-soft: #e7eefb; --good: #1d7a4c; --good-soft: #e3f4ea;
  --warn: #b26a00; --warn-soft: #fbf0dc; --bot: #eef2f7;
  --f-display: "Space Grotesk", system-ui, sans-serif;
  --f-body: "Noto Sans", "Noto Sans Devanagari", "Noto Sans Bengali", "Noto Sans Telugu", "Noto Sans Tamil", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
header h1 { font: 700 20px var(--f-display); margin: 0; }
header .tag { color: var(--muted); font-size: 13px; }
.badge { font: 600 11px var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.badge.live { background: var(--good-soft); color: var(--good); }
header select, header button { margin-left: auto; }
select, button, textarea { font: inherit; }
select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px; max-width: 1280px; margin: 0 auto; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-width: 0; }
.panel h2 { font: 600 13px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
#chat { height: 56vh; min-height: 320px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
.msg.bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg .en { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.msg.note { align-self: center; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.msg.done { align-self: center; background: var(--good-soft); color: var(--good); font-weight: 600; }
.confirm-row { display: flex; gap: 8px; margin-top: 8px; }
.composer { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
.samples { display: flex; gap: 6px; flex-wrap: wrap; }
.samples button { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.samples button:hover { border-color: var(--accent); color: var(--accent); }
.row { display: flex; gap: 8px; }
textarea { flex: 1; min-width: 0; resize: none; height: 64px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.btn { border: 0; border-radius: 10px; padding: 0 16px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.good { background: var(--good); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.rec { background: #c0392b; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { font: 600 11px var(--f-display); text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); margin-left: auto; }
.status.needs_confirmation { background: var(--accent-soft); color: var(--accent); }
.status.complete { background: var(--good-soft); color: var(--good); }
#claim { padding: 8px 16px 16px; display: grid; gap: 2px; }
.f { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.f span:first-child { color: var(--muted); }
.f .missing { color: var(--warn); font-style: italic; }
.f.flash { animation: flash 1.2s ease; }
@keyframes flash { from { background: var(--good-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .f.flash { animation: none; } }
.loss { background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 4px 0; font-size: 14px; }
.docs { padding: 12px 16px 16px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.docs .row select { flex: 1; min-width: 0; width: 0; }
.docs .row .btn { flex: none; }
pre#doc { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Consolas, monospace; background: var(--bg); padding: 12px; border-radius: 8px; max-height: 320px; overflow: auto; margin: 0; }
.hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Aapke Liye</h1>
  <span class="tag">Speak in your language, get your relief</span>
  <span class="badge" id="mode">…</span>
  <select id="lang" aria-label="Language">
    <option value="hi">हिंदी (Hindi)</option>
    <option value="en">English</option>
    <option value="bn">বাংলা (Bengali)</option>
    <option value="mr">मराठी (Marathi)</option>
    <option value="te">తెలుగు (Telugu)</option>
    <option value="ta">தமிழ் (Tamil)</option>
  </select>
  <button class="btn ghost" id="reset" style="height:34px">New claim</button>
</header>

<main>
  <section class="panel" aria-label="Conversation">
    <h2>Conversation</h2>
    <div id="chat" aria-live="polite"></div>
    <div class="composer">
      <div class="samples" id="samples"></div>
      <div class="row">
        <textarea id="input" placeholder="Type what the victim says… (Enter to send)"></textarea>
        <button class="btn ghost" id="mic" title="Record voice (live mode only)">🎤</button>
        <button class="btn" id="send">Send</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </section>

  <section class="panel" aria-label="Claim">
    <h2>Claim <span class="status" id="status">incomplete</span></h2>
    <div id="claim"></div>
    <div class="docs">
      <h2 style="padding:0;border:0">Documents (Phase 2)</h2>
      <div class="row">
        <select id="doctype" aria-label="Document type"></select>
        <button class="btn" id="draft" style="height:36px">Draft</button>
      </div>
      <pre id="doc" hidden></pre>
    </div>
  </section>
</main>

<script>
const SAMPLES = {
  hi: ["मेरा नाम रमेश कुमार है। पुरी जिला, ओडिशा। कल चक्रवात में मेरा कच्चा घर पूरी तरह टूट गया, दो लाख का नुकसान।", "सतपड़ा गाँव", "मेरा नंबर 9876543210 है", "हाँ, सही है"],
  en: ["My name is Joseph Mathew from Kuttanad village, Alappuzha district, Kerala. The flood on 14/08/2026 damaged my pucca house badly. The loss is about 3 lakh rupees. I also lost my ration card.", "+91 98765 43210", "yes"],
  bn: ["আমার নাম সুমিত্রা দাস। বন্যায় আমার কাঁচা বাড়ি পুরোপুরি ভেঙে গেছে। প্রায় এক লাখ টাকার ক্ষতি।"],
  mr: ["माझे नाव सुरेश पाटील आहे. दुष्काळामुळे माझे चार एकर कापसाचे पीक गेले. सुमारे एक लाख रुपयांचे नुकसान झाले."],
  te: ["నా పేరు వెంకట రావు. తుఫానులో నా ఇల్లు పూర్తిగా కూలిపోయింది. సుమారు రెండు లక్షల రూపాయల నష్టం."],
  ta: ["என் பெயர் முருகன். புயலில் என் குடிசை வீடு முழுமையாக அழிந்தது. சுமார் ஒரு லட்சம் ரூபாய் இழப்பு."],
};
const LABELS = {"claimant.name":"Name","claimant.phone":"Phone","location.village":"Village","location.district":"District","location.state":"State","disaster_type":"Disaster","incident_date":"Date","losses":"Losses"};
const $ = id => document.getElementById(id);
let claim = null, live = false, busy = false, lastJson = "";

function sessionId() { return "demo-" + Math.random().toString(36).slice(2, 8); }
let sid = sessionId();

function add(cls, text, en) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  if (en && en !== text) { const s = document.createElement("span"); s.className = "en"; s.textContent = en; d.appendChild(s); }
  $("chat").appendChild(d); $("chat").scrollTop = 1e9;
  return d;
}

function renderSamples() {
  const box = $("samples"); box.innerHTML = "";
  (SAMPLES[$("lang").value] || []).forEach((t, i) => {
    const b = document.createElement("button");
    b.textContent = i === 0 ? "Sample statement" : t.length > 22 ? t.slice(0, 22) + "…" : t;
    b.title = t; b.onclick = () => { $("input").value = t; $("input").focus(); };
    box.appendChild(b);
  });
}

function val(v) { return v === null || v === undefined || v === "" ? null : v; }
function inr(n) { return "₹" + Number(n).toLocaleString("en-IN"); }

function renderClaim(c, missing) {
  const prev = lastJson ? JSON.parse(lastJson) : null;
  lastJson = JSON.stringify(c);
  const rows = [
    ["claimant.name", c.claimant.name], ["claimant.phone", c.claimant.phone],
    ["location.village", c.location.village], ["location.district", c.location.district],
    ["location.state", c.location.state], ["disaster_type", c.disaster_type], ["incident_date", c.incident_date],
  ];
  const box = $("claim"); box.innerHTML = "";
  rows.forEach(([k, v]) => {
    const r = document.createElement("div"); r.className = "f";
    const before = prev ? k.split(".").reduce((o, p) => o && o[p], prev) : null;
    if (val(v) && v !== before) r.classList.add("flash");
    r.innerHTML = `<span>${LABELS[k]}</span><span></span>`;
    const s = r.lastChild;
    if (val(v)) s.textContent = v; else { s.textContent = "missing"; s.className = "missing"; }
    box.appendChild(r);
  });
  const lr = document.createElement("div"); lr.className = "f"; lr.innerHTML = "<span>Losses</span><span></span>";
  const ls = lr.lastChild;
  if (!c.losses.length) { ls.textContent = "missing"; ls.className = "missing"; }
  c.losses.forEach(l => {
    const d = document.createElement("div"); d.className = "loss";
    const bits = [l.house_kind, l.damage_level, l.crop_name, l.area_acres && l.area_acres + " acres",
                  l.count && l.count + " " + (l.animal || ""), l.vehicle_kind].filter(Boolean).join(", ");
    d.textContent = `${l.type.toUpperCase()}${bits ? " · " + bits : ""} · ${l.amount_inr ? inr(l.amount_inr) : "amount missing"}`;
    ls.appendChild(d);
  });
  box.appendChild(lr);
  if (c.documents_lost.length) {
    const r = document.createElement("div"); r.className = "f";
    r.innerHTML = "<span>Documents lost</span><span></span>"; r.lastChild.textContent = c.documents_lost.join(", ");
    box.appendChild(r);
  }
  const st = $("status"); st.textContent = c.status.replace("_", " "); st.className = "status " + c.status;
}

function play(b64) {
  if (!b64) return;
  try { new Audio("data:audio/mpeg;base64," + b64).play().catch(() => {}); } catch (e) {}
}

async function turn(body, userText) {
  if (busy) return; busy = true; $("send").disabled = true;
  if (userText) add("user", userText);
  const thinking = add("bot", "…");
  try {
    const r = await fetch("/v1/claim/turn", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid, language: $("lang").value, claim, ...body }) });
    const data = await r.json();
    thinking.remove();
    if (!r.ok) { add("note", "Error: " + JSON.stringify(data.detail || data)); return; }
    claim = data.claim;
    renderClaim(claim, data.missing_fields);
    if (data.message && data.status !== "complete") add("note", data.message);
    if (data.status === "complete") { add("done", data.message || "Claim recorded ✓"); return; }
    if (data.next_question) {
      const m = add("bot", data.next_question.text, data.next_question.text_en);
      play(data.next_question.audio_base64);
      if (data.next_question.field === "confirm") {
        const row = document.createElement("div"); row.className = "confirm-row";
        const ok = document.createElement("button"); ok.className = "btn good"; ok.textContent = "✓ Confirm"; ok.style.height = "32px";
        const ed = document.createElement("button"); ed.className = "btn ghost"; ed.textContent = "✎ Edit"; ed.style.height = "32px";
        ok.onclick = () => { row.remove(); turn({ confirmed: true }, "✓ Confirm"); };
        ed.onclick = () => { row.remove(); turn({ confirmed: false }, "✎ Edit"); };
        row.append(ok, ed); m.appendChild(row);
      }
    }
  } catch (e) { thinking.remove(); add("note", "Could not reach the server: " + e.message); }
  finally { busy = false; $("send").disabled = false; }
}

function send() {
  const t = $("input").value.trim(); if (!t) return;
  $("input").value = ""; turn({ text: t }, t);
}

function reset() {
  claim = null; lastJson = ""; sid = sessionId(); $("chat").innerHTML = ""; $("doc").hidden = true;
  turn({}, null);
}

// ---- mic (live mode)
let rec = null, chunks = [];
async function toggleMic() {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      $("mic").classList.remove("rec"); $("mic").textContent = "🎤";
      const blob = new Blob(chunks, { type: rec.mimeType });
      const b64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(",")[1]); fr.readAsDataURL(blob); });
      turn({ audio_base64: b64 }, "🎤 voice note");
    };
    rec.start(); $("mic").classList.add("rec"); $("mic").textContent = "■";
  } catch (e) { add("note", "Microphone not available: " + e.message); }
}

async function init() {
  try {
    const h = await (await fetch("/health")).json();
    live = h.mode === "live";
    $("mode").textContent = live ? "live · " + h.llm_model : "mock mode";
    $("mode").className = "badge" + (live ? " live" : "");
    $("mic").disabled = !live;
    $("hint").textContent = live ? "Type or press 🎤 to speak." :
      "Mock mode: offline keyword rules, type instead of speaking. Add a Gemini key and set CLAIM_AI_MODE=live for full AI + voice.";
  } catch (e) { $("mode").textContent = "offline"; }
  const types = await (await fetch("/v1/documents/types")).json();
  types.forEach(t => { const o = document.createElement("option"); o.value = t.doc_type; o.textContent = t.title; $("doctype").appendChild(o); });
  renderSamples(); reset();
}

$("send").onclick = send;
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("lang").onchange = () => { renderSamples(); reset(); };
$("reset").onclick = reset;
$("mic").onclick = toggleMic;
$("draft").onclick = async () => {
  if (!claim) return;
  const r = await fetch("/v1/documents/draft", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ doc_type: $("doctype").value, claim }) });
  const d = await r.json();
  $("doc").hidden = false; $("doc").textContent = r.ok ? d.text : JSON.stringify(d);
};
init();
</script>
</body>
</html>
