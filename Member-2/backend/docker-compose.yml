# Production-style stack: API + Postgres/PostGIS with persistent volumes.
#   1. Put the production values in .env (see .env.example), then:
#   2. docker compose up -d --build
#   3. curl http://localhost:8000/health
# For local development without Docker, just run uvicorn (SQLite); see README.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aapke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aapke_liye
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local access only; never expose the DB publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aapke -d aapke_liye"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://aapke:${POSTGRES_PASSWORD}@db:5432/aapke_liye
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?set STORAGE_ENCRYPTION_KEY in .env}
      STAFF_API_KEYS: ${STAFF_API_KEYS:?set STAFF_API_KEYS in .env}
      MEMBER1_AI_URL: ${MEMBER1_AI_URL:?set MEMBER1_AI_URL in .env}
      MEMBER3_VERIFY_URL: ${MEMBER3_VERIFY_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      RATE_LIMIT_CREATE: ${RATE_LIMIT_CREATE:-10/minute}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-30/minute}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  storage:
